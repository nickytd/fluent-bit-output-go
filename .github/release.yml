changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "Features"
      labels:
        - feat
        - enhancement
    - title: "Bug Fixes"
      labels:
        - fix
        - bug
    - title: "Documentation"
      labels:
        - docs
        - documentation
    - title: "Build & Tooling"
      labels:
        - chore
        - ci
        - build
    - title: "Refactoring"
      labels:
        - refactor
    - title: "Tests"
      labels:
        - test
    - title: "Other Changes"
      labels:
        - "*"
