name: Release

on:
  push:
    tags:
      - 'v*'

# One release build at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=fluent-bit-output-go
            org.opencontainers.image.description=OTLP output plugin for Fluent Bit (initContainer image)

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # GitHub auto-generates categorized notes from commits and merged
          # PRs between this tag and the previous one. Conventional Commit
          # subjects (feat/fix/docs/chore/ci/refactor/test) end up as the
          # section headings.
          generate_release_notes: true
          body: |
            ## Container image

            Multi-arch image published to GHCR:

            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`

            Supported platforms: `linux/amd64`, `linux/arm64`.

            See the [README](https://github.com/${{ github.repository }}#container-image-and-kubernetes-deployment)
            for the initContainer usage pattern.
          append_body: true
          fail_on_unmatched_files: false
