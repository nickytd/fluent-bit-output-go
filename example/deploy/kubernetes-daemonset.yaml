apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
data:
  # Reference fluent-bit config that loads the go-out plugin from the shared
  # volume populated by the initContainer.
  fluent-bit.yaml: |
    service:
      flush: 1
      daemon: off
      log_level: info

    pipeline:
      inputs:
        - name: tail
          path: /var/log/containers/*.log
          tag: kube.*

      outputs:
        - name: go-out
          match: "*"
          otlp_grpc: fluent-bit-collector.observability.svc.cluster.local:4317
          queue_dir: /var/lib/fluent-bit/queue
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Copies /plugin/go-out.so from the plugin image onto the shared
        # emptyDir at /output, which fluent-bit then loads with `-e`.
        - name: install-plugin
          image: ghcr.io/nickytd/fluent-bit-output-go:v0.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: plugin
              mountPath: /output
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - -c
            - /fluent-bit/etc/fluent-bit.yaml
            - -e
            - /fluent-bit/plugins/go-out.so
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: plugin
              mountPath: /fluent-bit/plugins
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: queue
              mountPath: /var/lib/fluent-bit/queue
      volumes:
        # Shared between the initContainer (writes go-out.so here) and the
        # fluent-bit main container (reads it via -e).
        - name: plugin
          emptyDir: {}
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        # Persistent bbolt queue survives pod restarts on the same node.
        - name: queue
          hostPath:
            path: /var/lib/fluent-bit/queue
            type: DirectoryOrCreate
